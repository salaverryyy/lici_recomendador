[project]
name = "licitex"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "psycopg[binary]",
  "python-dotenv",
  "uvicorn",
  "pwdlib[argon2]",
  "email-validator",
  "python-multipart",
  "Pillow",
  "pypdf[crypto]",
  "boto3",
]

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend && node scripts/build-static.mjs"
